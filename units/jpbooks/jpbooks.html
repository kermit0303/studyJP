<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>健康紀錄多圖表（固定顯示數字）</title>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}
    </style>
</head>
<body>
      
<div id="fallback" style="display:none;">
  ❌ 服務掛了，顯示替代畫面
</div>

<iframe id="gameFrame" style="width:100vw; height:100vh; border:none;"></iframe>
<script>
const url = "https://absent-fitting-calculations-explicit.trycloudflare.com";
const iframe = document.getElementById("gameFrame");
const fallback = document.getElementById("fallback");

let loaded = false;

// 載入成功
iframe.onload = () => {
  loaded = true;
};

// 先設定 src
iframe.src = url;

// 設 timeout（例如 5 秒）
setTimeout(() => {
  if (!loaded) {
    iframe.style.display = "none";
    fallback.style.display = "block";
  }
}, 5000);
</script>

    
</body>
</html>
