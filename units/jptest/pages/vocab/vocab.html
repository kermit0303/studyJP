<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <title>詞彙工具</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>

    .inbody {
      margin: 0;
      font-family: 'Noto Serif TC', serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #faf8f4;
      color: #4a4a4a;
      /* 溫和深灰 */
    }

    #word-list {
      flex: 1;
      overflow-y: auto;
      /* ✅ 滾軸只在這裡 */
      box-sizing: border-box;
      padding: 10px;
    }
    /* 日系風格表格標題 */
table caption {
  margin-top: 30px;
  text-align: left;            
  font-family: 'Noto Serif JP', 'Noto Serif TC', serif;
  font-size: 30px;             
  font-weight: 600;            /* 稍微加粗 */
  color: #2c3e50;              
  letter-spacing: 0.05em;      
  margin-bottom: 0.5em;        /* 與表格保持距離 */
  border-bottom: 2px solid #e67e22; /* 加底線強調 */
  padding-bottom: 0.2em;
}

table caption::before {
  content: "§ ";
  font-size: 28px;
  vertical-align: middle;
  color: #e67e22; 
}

/* 可選：給 caption 淡背景 */
table caption {
  background: #fdf6ec;   /* 淡米橙背景 */
  padding: 0.4em 0.6em;
  border-radius: 8px;    /* 圓角 */
}

  </style>
</head>

<body>

  <div class="toolbar">
    <a href="vocab.html" class="active">単語</a>
    <a href="../grammar/grammar.html">文型</a>
    <a href="../record/record.html">記錄</a>
    <p id="vid" style="color: #ccc;">V1.0.31</p>
  </div>
  <div class="inbody">
    <div class="sidebar">
      <ul id="category-list"></ul>
    </div>

    <div class="main">
      <div class="top-bar">
        <button id="toggle-sidebar">☰</button>
        <div class="search-box">

        </div>
      </div>

    <button id="downloadWordBtn" class="jp-button-green">下載檔案 （記得使用瀏覽器）</button>
      <div id="word-list"></div>
    </div>
  </div>
  <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
  <script src="../../js/func.js"></script>
  <script src="vocab.js"></script>
  <script>
function exportToWord() {
    const content = document.getElementById("grammar-content").innerHTML;

    const fullHtml = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office'
              xmlns:w='urn:schemas-microsoft-com:office:word'
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset="utf-8">
            <title>Export to DOCX</title>
            <style>
                body { font-family: Arial, sans-serif; }
                h1 { color: #2c3e50; }
                p { font-size: 14px; }
                ul { margin-left: 20px; }
            </style>
        </head>
        <body>
            ${content}
        </body>
        </html>
    `;

    const blob = window.htmlDocx.asBlob(fullHtml);

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "grammar.docx";

    document.body.appendChild(link);
    link.click();

    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
}
</script>
</body>

</html>
